<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilmPolski · Odkrywaj kino</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202a37;background:#f5f6f8;font-size:16px;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8ab9f5;outline-offset:3px}header{background:white;border-bottom:1px solid #e5e8ed;padding:20px 4%;display:flex;align-items:center;gap:12px}.logo{background:#235de5;color:white;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;font-weight:800}.brand{font-size:21px;font-weight:750;letter-spacing:-.6px}.caption{margin-left:auto;color:#737d8e;font-size:13px}main{max-width:1560px;margin:auto;padding:30px 4%}h1{font-size:30px;letter-spacing:-1px;margin:0 0 6px;font-weight:750}.intro{color:#737d8e;margin:0 0 24px}.filters{padding:22px;background:white;border:1px solid #e5e8ed;border-radius:16px;box-shadow:0 3px 12px #18284104}.fields{display:grid;grid-template-columns:1fr 1fr 220px auto auto;gap:14px;align-items:end}label{display:block;font-size:13px;font-weight:650}input,select{display:block;width:100%;margin-top:8px;border:1px solid #dce1e8;border-radius:9px;padding:12px;color:#202a37;background:#fafbfc;min-width:0}input::placeholder{color:#939ba9}.primary,.secondary{border:0;border-radius:9px;padding:13px 22px;font-weight:650}.primary{background:#235de5;color:white}.primary:hover{background:#194dc5}.secondary{background:#edf1f7;color:#4c596c}.hint{font-size:12px;color:#768091;margin:14px 0 0}.workspace{display:grid;grid-template-columns:minmax(290px, .85fr) minmax(360px,1.4fr);gap:22px;margin-top:24px}.results-panel,.detail{border:1px solid #e5e8ed;background:white;border-radius:16px;overflow:hidden}.results-heading{padding:20px;border-bottom:1px solid #edf0f4;display:flex;align-items:center;justify-content:space-between}.results-heading h2{font-size:15px;margin:0}.count{font-size:12px;color:#52627a;background:#eff3f8;padding:5px 9px;border-radius:20px}.results{overflow:auto;max-height:calc(100vh - 405px);min-height:280px;padding:10px;scrollbar-width:thin}.result{width:100%;text-align:left;border:1px solid transparent;background:white;display:block;padding:15px;border-radius:10px;margin-bottom:4px}.result:hover{background:#f6f8fc}.result[aria-pressed=true]{background:#edf3ff;border-color:#c9dafa}.result-title{display:block;font-size:14px;line-height:1.5;font-weight:650}.result[aria-pressed=true] .result-title{color:#194dc5}.meta{display:flex;gap:10px;align-items:center;margin-top:7px;font-size:12px;color:#748093}.pill{font-size:11px;background:#edf1f6;color:#536078;border-radius:5px;padding:3px 7px}.detail{padding:30px 34px;overflow:auto;max-height:calc(100vh - 340px);scrollbar-width:thin}.detail h2{font-size:29px;letter-spacing:-.8px;line-height:1.25;margin:14px 0 10px}.detail h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7d8796;margin:27px 0 10px}.detail p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.8;margin:0}.detail .year{color:#69768a;font-size:15px}.detail .topline{color:#235de5;font-size:12px;font-weight:650}.empty{padding:35px 20px;text-align:center;color:#748093;line-height:1.8}.status{font-size:12px;color:#768091;margin:15px 2px}.section{border-top:1px solid #edf0f4;margin-top:23px}.locations{display:flex;flex-wrap:wrap;gap:7px}.location{background:#f1f5fa;padding:6px 10px;border-radius:7px;font-size:13px;color:#52627a}@media(min-width:1000px){body{height:100vh;overflow:hidden}}@media(max-width:1000px){.fields{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr 1.2fr}.detail{padding:24px}.caption{display:none}}@media(max-width:700px){.fields,.workspace{grid-template-columns:1fr}.results{max-height:360px}.detail{max-height:none}main{padding:24px 16px}h1{font-size:26px}}

.credits{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px}.credits .section{min-width:0}
@media(min-width:1000px){main{height:100dvh;display:flex;flex-direction:column;padding-top:20px;padding-bottom:12px}.workspace{flex:1;min-height:0}.results-panel{display:flex;flex-direction:column;min-height:0}.results{flex:1;min-height:0;max-height:none}.detail{max-height:none;min-height:0}.filters{flex-shrink:0}.status{flex-shrink:0;margin-bottom:0}}
@media(max-width:700px){.credits{grid-template-columns:1fr;gap:0}}
.kind-filters{display:flex;gap:8px;margin-top:16px}.kind-filters button{border:1px solid #dce1e8;border-radius:20px;padding:7px 16px;background:white;color:#52627a;font-size:13px}.kind-filters button[aria-pressed=true]{background:#edf3ff;border-color:#9bbaf9;color:#194dc5;font-weight:650}
</style>
<main><form class="filters" id="filters"><div class="fields"><label>Lokacja<input id="location" placeholder="np. Gdynia" autofocus></label><label>Fragment opisu<input id="description" placeholder="np. podróż, rodzina, tajemnica"></label><label>Sortowanie<select id="sort"><option value="title">Tytuł A–Z</option><option value="newest">Rok: od najnowszych</option><option value="oldest">Rok: od najstarszych</option></select></label><button class="primary" type="submit">Szukaj</button><button class="secondary" type="reset">Wyczyść</button></div><div class="kind-filters" role="group" aria-label="Rodzaj produkcji"><button type="button" data-kind="" aria-pressed="true">Wszystkie</button><button type="button" data-kind="movies" aria-pressed="false">Filmy</button><button type="button" data-kind="series" aria-pressed="false">Seriale</button></div><p class="hint">Oba wypełnione pola muszą pasować. Puste pole nie ogranicza wyników. Wielkość liter nie ma znaczenia.</p></form>
<div class="workspace"><section class="results-panel"><div class="results-heading"><h2>Wyniki wyszukiwania</h2><span class="count" id="count">…</span></div><div class="results" id="results" aria-label="Wyniki wyszukiwania"></div></section><article class="detail" id="detail" aria-label="Szczegóły produkcji"><div class="empty">Wczytywanie biblioteki…</div></article></div><p class="status" id="status" role="status"></p></main>
<script>
const $=id=>document.getElementById(id);let searchVersion=0,detailVersion=0,selectedKind="";
function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
async function json(url){const response=await fetch(url);if(!response.ok)throw Error('Nie udało się wczytać danych.');return response.json()}
async function selectResult(item,button){const version=++detailVersion;document.querySelectorAll('.result').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));$('detail').replaceChildren(node('div','Wczytywanie szczegółów…','empty'));try{const data=await json('/api/detail/'+item.index);if(version!==detailVersion)return;const s=data.sections;const panel=$('detail');panel.replaceChildren(node('div',data.kind==='series'?'SERIAL':'FILM','topline'),node('h2',s[0][1]),node('p',s[1][1],'year'));const credits=node('div','','credits');panel.append(credits);for(const i of [2,3,4,5]){const section=node('section','','section');section.append(node('h3',s[i][0].split(' (')[0]));section.append(node('p',s[i][1]));(i===2||i===3?credits:panel).append(section)}panel.scrollTop=0}catch(e){if(version===detailVersion)$('detail').replaceChildren(node('div',e.message,'empty'))}}
function sortResults(results,order){
const year=item=>{const match=String(item.years).match(/\b\d{4}\b/);return match?Number(match[0]):null};
return results.sort((a,b)=>{if(order!=='title'){const x=year(a),y=year(b);if(x===null&&y!==null)return 1;if(y===null&&x!==null)return -1;if(x!==y)return order==='newest'?y-x:x-y}return a.title.localeCompare(b.title,'pl')});
}
async function search(){const version=++searchVersion;++detailVersion;$('status').textContent='Wyszukiwanie…';const params=new URLSearchParams({location:$('location').value,description:$('description').value,kind:selectedKind});try{const data=await json('/api/search?'+params);if(version!==searchVersion)return;sortResults(data.results,$('sort').value);$('count').textContent=data.results.length.toLocaleString('pl-PL');$('status').textContent=`${data.results.length} wyników · ${data.total} produkcji w bibliotece`+(data.errors?` · Pominięte błędne pliki: ${data.errors}`:'');const fragment=document.createDocumentFragment();for(const item of data.results){const b=node('button','','result');b.type='button';b.setAttribute('aria-pressed','false');b.append(node('span',item.title,'result-title'));const meta=node('span','','meta');meta.append(node('span',item.years),node('span',item.kind==='series'?'Serial':'Film','pill'));b.append(meta);b.onclick=()=>selectResult(item,b);b.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const next=e.key==='ArrowDown'?b.nextElementSibling:b.previousElementSibling;if(next){next.focus();next.click()}}};fragment.append(b)}$('results').replaceChildren(fragment);$('results').scrollTop=0;if(data.results.length)selectResult(data.results[0],$('results').firstElementChild);else{$('results').append(node('div','Nie znaleziono pasujących produkcji.','empty'));$('detail').replaceChildren(node('div','Spróbuj krótszego fragmentu lub wyczyść jedno z pól.','empty'))}}catch(e){if(version===searchVersion){$('status').textContent=e.message+' Sprawdź, czy skrypt nadal działa.';$('results').replaceChildren();$('count').textContent='—';$('detail').replaceChildren(node('div','Brak połączenia z biblioteką.','empty'))}}}
$('filters').onsubmit=e=>{e.preventDefault();search()};function setKind(kind){selectedKind=kind;document.querySelectorAll('[data-kind]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.kind===kind)))}
document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>{setKind(button.dataset.kind);search()});
$('sort').onchange=search;
$('filters').onreset=()=>{setKind('');setTimeout(search,0)};search();
</script>
</html>
